name: Publikuj Prawko na GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Sprawdź i zbuduj aplikację
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Pobierz kod
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Przygotuj Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - name: Zainstaluj zależności z pliku blokady
        run: npm ci
      - name: Sprawdź typy
        run: npm run typecheck
      - name: Sprawdź lint
        run: npm run lint
      - name: Sprawdź logikę
        run: npm test
      - name: Zainstaluj przeglądarkę do testów
        run: npx playwright install --with-deps chromium
      - name: Zbuduj aplikację i sprawdź ją w przeglądarce
        run: npm run test:e2e
      - name: Przygotuj pliki strony
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy:
    name: Opublikuj stronę
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Sprawdź ustawienia GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Wdróż sprawdzoną aplikację
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
